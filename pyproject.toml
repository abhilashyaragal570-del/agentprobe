[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentprobe-eval"
version = "0.1.0"
description = "Evaluation and regression testing for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abhilash Yaragal" }]
keywords = ["llm", "ai-agents", "evaluation", "regression-testing", "testing", "flaky-tests"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = ["pydantic>=2", "httpx"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/abhilashyaragal570-del/agentprobe"
Issues = "https://github.com/abhilashyaragal570-del/agentprobe/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]